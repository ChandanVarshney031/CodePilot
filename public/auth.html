<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePilot - Authentication</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            text-align: center;
        }
        .toggle-text {
            cursor: pointer;
            color: var(--primary);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">CodePilot</a>
    </nav>
    <div class="auth-container card">
        <h2 id="formTitle">Sign In to CodePilot</h2>
        <p class="text-secondary mb-2" id="formDesc">Welcome back, let's keep that streak alive!</p>
        
        <div id="errorMsg" style="color: var(--danger); margin-bottom: 1rem;" class="hidden"></div>

        <form id="authForm">
            <div class="form-group hidden" id="usernameGroup">
                <label>Username</label>
                <input type="text" id="username" class="form-control" placeholder="johndoe">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Continue</button>
        </form>

        <p class="mt-2 text-secondary">
            <span id="toggleQuestion">Don't have an account?</span> 
            <span class="toggle-text" id="toggleMode">Sign up</span>
        </p>
    </div>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
